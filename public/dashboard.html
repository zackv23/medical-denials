<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — DenialOps</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"><div class="wrap" id="nav"></div></header>
<main class="wrap" style="padding-top:24px;padding-bottom:40px">
<h1 id="h">Onboarding &amp; claims</h1>
<div class="bonus" id="bonus"></div>
<div class="grid" style="margin-bottom:20px"><div class="card"><h3>Onboarding checklist</h3><ol class="steps" id="steps"></ol></div>
<div><div class="kpis" id="kpis"></div></div></div>
<div class="card" id="billing" style="margin-bottom:20px"></div>
<div class="card" id="spectips" style="margin-bottom:20px" hidden></div>
<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Claims</h3>
<label style="display:flex;gap:8px;align-items:center">Status <select id="flt" style="width:auto"><option value="">All</option></select></label></div>
<div class="tbl"><table><thead><tr><th>Claim</th><th>Payer ICN</th><th>CARC</th><th>Category</th><th>Denied</th><th>Status</th><th>Next step</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="empty" hidden>No claims yet. <a href="/upload.html">Upload your first denials</a>.</p></div>
<dialog id="dlg" style="max-width:640px;width:92%"><pre id="letter"></pre><button class="btn sm" onclick="dlg.close()">Close</button></dialog>
</main>
<script src="/app.js"></script><script>
const ST=["new","in_review","appealed","resubmitted","paid","written_off"];
(async()=>{const u=await me();nav(u.user,"/dashboard.html");
 h.textContent=u.practice.name+" — onboarding & claims";
 flt.innerHTML+=ST.map(s=>`<option>${s}</option>`).join("");
 async function load(){const s=await api("/api/summary");
  bonus.textContent=`🎉 Year-end sign-up bonus: up to ${money(s.bonus_cents)} in billing credit, matched dollar for dollar (${u.practice.doctor_count} doctor${u.practice.doctor_count>1?"s":""}). Offer ends ${s.bonus_deadline}.`;
  steps.innerHTML=s.steps.map(x=>`<li class="${x.done?"done":""}"><span class="dot">${x.done?"✓":""}</span>${x.href&&!x.done?`<a href="${esc(x.href)}">${esc(x.label)}</a>`:esc(x.label)}</li>`).join("");
  const b=s.billing;billing.innerHTML=`<h3>Billing &amp; bonus credit</h3><p style="margin:0 0 8px;color:var(--muted)">Fees: 3% of denied pre-auth claims + ⅓ of all other denied claims. Your bonus matches fees dollar for dollar as billing credit.</p>
  <div class="row" style="gap:24px"><div><b>${money(b.fee_cents)}</b><br><small>Fees</small></div><div><b>${money(b.credit_applied_cents)}</b><br><small>Bonus credit applied</small></div><div><b>${money(b.credit_remaining_cents)}</b><br><small>Credit remaining</small></div><div><b>${money(b.amount_due_cents)}</b><br><small>Amount due</small></div></div>`;
  const TIPS={primary_care:[{title:"Modifier 25 — same-day procedures",tip:"Append modifier 25 to E&M when a procedure is performed same day. Document a significant, separately identifiable evaluation distinct from the procedure."},{title:"Preventive vs. diagnostic split",tip:"Bill both preventive and E&M codes when a problem is addressed at a preventive visit. Use modifier 33 or document both ICD-10s to prevent CARC 97 bundling."},{title:"Annual wellness vs. office visit",tip:"AWV uses G0438/G0439 with Z00.00/Z00.01 — never substitute office E&M codes. Medicare pays differently and cost-sharing differs for patients."},{title:"Timely filing alert at 60 days",tip:"Most commercial payers require submission within 90–180 days. Set a 60-day alert on outstanding claims to leave time for corrections before the window closes."}],pediatrics:[{title:"Age-band CPT for well-child",tip:"Use 99381–99385 (new patient) or 99391–99395 (established) by the patient's age group — not office E&M codes. Age-band mismatches trigger CARC 4 denials."},{title:"Vaccine counseling (90460/90461)",tip:"Bill 90460 for the first vaccine and 90461 for each additional one — but only when the note documents face-to-face counseling given, not just the vaccine administered."},{title:"EPSDT documentation",tip:"Medicaid EPSDT requires documentation of all screening components: vision, hearing, developmental, dental, and immunization status. Missing items trigger CARC 50."},{title:"Vaccine authorization",tip:"Vaccines are covered without prior auth under most plans. Keep VIS documentation to quickly respond to any unexpected CARC 243 denials."}],acute_care:[{title:"Inpatient admission order language",tip:"The physician order must say 'admitted as inpatient' — not 'hold for observation.' This determines inpatient vs. obs status, billing method, and patient cost-sharing."},{title:"Two-midnight rule documentation",tip:"For Medicare, document in the H&P the clinical expectation of a 2-midnight inpatient stay. Payer reviewers need the clinical rationale, not just the admission order."},{title:"InterQual/MCG clinical indicators",tip:"List specific indicators in the H&P and admission orders: vitals instability, need for IV medications, continuous monitoring. Generic 'medically necessary' language is insufficient."},{title:"CARC 125 → corrected claim, not appeal",tip:"Billing errors (revenue code, type of bill, diagnosis pointer) need a corrected claim (TOB ending in 7), not an appeal. Sending a clinical appeal for a billing error wastes time."}]};
  const SLABELS={primary_care:"Primary Care",pediatrics:"Pediatrics",acute_care:"Acute Care"};
  if(TIPS[s.specialty]){spectips.hidden=false;spectips.innerHTML=`<h3>${esc(SLABELS[s.specialty])} — denial prevention tips</h3><div class="grid" style="gap:12px">${TIPS[s.specialty].map(t=>`<div class="card" style="padding:14px 16px"><strong>${esc(t.title)}</strong><p style="margin:4px 0 0;color:var(--muted);font-size:0.9em">${esc(t.tip)}</p></div>`).join("")}</div>`;}
  const n=s.by_status.reduce((a,r)=>a+r.n,0);
  kpis.innerHTML=[["Claims denied",n],["Dollars at risk",money(s.total_denied_cents)],["Recovered",money(s.recovered_cents)]].map(([l,v])=>`<div class="card kpi"><div class="n">${v}</div><div class="l">${l}</div></div>`).join("");
  const c=await api("/api/claims"+(flt.value?"?status="+flt.value:""));
  empty.hidden=c.claims.length>0;
  rows.innerHTML=c.claims.map(r=>`<tr><td>${esc(r.claim_id)}</td><td>${esc(r.payer_icn)}</td><td>${esc(r.carc)}</td><td>${esc(r.category)}</td><td>${money(r.denied_cents)}</td>
   <td><select data-id="${esc(r.id)}" aria-label="Status for ${esc(r.claim_id)}">${ST.map(s=>`<option ${s==r.status?"selected":""}>${s}</option>`).join("")}</select></td>
   <td>${esc(r.recommended_action)}</td><td><button class="btn ghost sm" data-appeal="${esc(r.id)}">Draft appeal</button></td></tr>`).join("");}
 flt.onchange=load;
 rows.onchange=async e=>{if(e.target.dataset.id){await api("/api/claims/"+e.target.dataset.id,{method:"PATCH",body:{status:e.target.value}});load()}};
 rows.onclick=async e=>{const id=e.target.dataset.appeal;if(id){letter.textContent=(await api(`/api/claims/${id}/appeal`)).letter;dlg.showModal()}};
 load();})();
</script></body></html>
