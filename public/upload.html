<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload denials — DenialOps</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="top"><div class="wrap" id="nav"></div></header>
<main class="wrap" style="max-width:820px;padding-top:24px;padding-bottom:40px">
<h1>Upload denials</h1>
<div class="msg err" id="gate" hidden>Sign the <a href="/hipaa.html">HIPAA release form</a> before uploading.</div>
<div class="drop" id="drop"><p><strong>Drop files here</strong> or choose them</p>
<p style="color:var(--muted)">X12 835 remittance (.edi, .835, .txt) · CSV (claim_id, carc, denied) · PDF/image denial letters · max 25 MB</p>
<input type="file" id="file" multiple style="max-width:320px"></div>
<div id="out" style="margin-top:16px"></div>
<h2 style="margin-top:28px">Add a single denial</h2>
<form class="stack card" id="one"><div class="row"><label style="flex:1">Claim ID<input name="claim_id" required></label><label style="flex:1">CARC code<input name="carc" required placeholder="50"></label><label style="flex:1">Denied amount ($)<input name="denied_amount" type="number" step="0.01" min="0.01" required></label></div>
<label>Payer ICN (optional)<input name="payer_icn"></label><div class="msg" id="m1" hidden role="status"></div><button class="btn">Add denial</button></form>
<h2 style="margin-top:28px">Uploaded files</h2><div class="card tbl"><table><thead><tr><th>File</th><th>Type</th><th>Claims</th><th>When</th><th></th></tr></thead><tbody id="files"></tbody></table></div>
</main><script src="/app.js"></script><script>
(async()=>{const u=await me();nav(u.user,"/upload.html");if(!u.hipaa_signed)gate.hidden=false;
async function list(){const r=await api("/api/files");files.innerHTML=r.files.map(f=>`<tr><td>${esc(f.filename)}</td><td>${esc(f.kind)}</td><td>${f.claims_imported}</td><td>${esc(f.created_at)}</td><td><a href="/api/files/${esc(f.id)}/download">Download</a></td></tr>`).join("")}
async function send(fl){for(const file of fl){const fd=new FormData();fd.append("file",file);const p=document.createElement("div");out.prepend(p);
 try{const r=await api("/api/uploads",{method:"POST",body:fd});p.className="msg ok";p.textContent=`${file.name}: ${r.kind==="document"?"stored":"imported "+r.claims_imported+" denial(s), "+money(r.denied_cents)+" at risk"}`}
 catch(e){p.className="msg err";p.textContent=`${file.name}: ${e.data&&e.data.error==="hipaa_required"?"sign the HIPAA release form first":e.message}`}}list()}
file.onchange=()=>send(file.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");send(e.dataTransfer.files)};
one.onsubmit=async e=>{e.preventDefault();try{await api("/api/claims",{method:"POST",body:Object.fromEntries(new FormData(one))});show(m1,"Added.","ok");one.reset()}catch(x){show(m1,x.data&&x.data.error==="hipaa_required"?"Sign the HIPAA release form first.":x.message)}};
list()})();
</script></body></html>
